name: Atualizar cptec.json

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */3 * * *'   # a cada 3 h (UTC)

permissions:
  contents: write

concurrency:
  group: cptec
  cancel-in-progress: false

jobs:
  cptec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar cptec.json
        run: node atualizar-cptec.mjs

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cptec.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "chore: atualiza cptec.json"
          git pull --rebase origin main
          git push
