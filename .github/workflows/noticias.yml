name: Atualizar noticias.json

on:
  schedule:
    - cron: '0 */3 * * *'   # a cada 3 horas (horário UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Buscar manchetes
        run: node scripts/atualizar-noticias.mjs
        env:
          OUT: noticias.json
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "chore: atualiza noticias.json" && git push)

