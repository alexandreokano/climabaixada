name: Atualizar cache do clima

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-clima
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Conferir index.html
        run: |
          echo "Branch: $GITHUB_REF_NAME | Commit: $GITHUB_SHA"
          if [ ! -f index.html ]; then
            echo "::error::index.html não existe na raiz do repositório. Arquivos na raiz:"
            ls -la
            exit 1
          fi
          echo "index.html: $(wc -c < index.html) bytes"
          grep -n "const PLACES=" index.html || { echo "::error::'const PLACES=' não encontrado em index.html. A versão publicada nesta branch está desatualizada."; exit 1; }
          grep -n "const VB=" index.html || { echo "::error::'const VB=' não encontrado em index.html. A versão publicada nesta branch está desatualizada."; exit 1; }
      - name: Gerar cache
        run: node atualizar-cache.mjs
        env:
          HTML: index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza cache do clima"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep 5
          done
          exit 1
