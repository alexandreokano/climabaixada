name: Atualizar dados.json

on:
  schedule:
    - cron: '23 9,21 * * *'   # 06h23 e 18h23 de Brasília (UTC-3)
    - cron: '47 11 * * *'     # reserva: 08h47 de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-json
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar dados.json
        run: node gerar-dados.mjs

      - name: Atualizar CETESB
        continue-on-error: true
        run: node atualizar-cetesb.mjs

      - name: Publicar se mudou
        run: |
          if git diff --quiet -- dados.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza dados.json (automático)"
          git pull --rebase
          git push
